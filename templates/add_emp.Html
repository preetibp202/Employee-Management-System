<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>


<body>

    {% include 'navbar.html' %}

    <h1 class="text-center my-4 page-title">Add New Employee</h1>

    <div class="container my-4">

        <div class="employee-card">

            <h3 class="form-title">Employee Details</h3>
            <p class="form-subtitle">
                Enter the employee information below
            </p>

            <form method="POST" action="{% url 'add_emp' %}">

                {% csrf_token %}

                <div class="row">

                    <!-- Employee ID -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="emp_id" class="form-label">
                                Employee ID
                            </label>

                            <input type="number" class="form-control custom-input" id="emp_id" name="emp_id" required>
                        </div>
                    </div>

                    <!-- Name -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                Name
                            </label>

                            <input type="text" class="form-control custom-input" id="name" name="emp_name" required>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                Email
                            </label>

                            <input type="email" class="form-control custom-input" id="email" name="emp_email" required>
                        </div>
                    </div>

                    <!-- Department -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="department" class="form-label">
                                Department
                            </label>

                            <select class="form-select custom-input" id="department" name="emp_department" required>

                                <option value="">Select Department</option>
                                <option value="HR">HR</option>
                                <option value="IT">IT</option>
                                <option value="Finance">Finance</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Software developer">
                                    Software developer
                                </option>
                                <option value="Machine Learning">
                                    Machine Learning
                                </option>

                            </select>
                        </div>
                    </div>

                    <!-- Address -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="address" class="form-label">
                                Address
                            </label>

                            <input type="text" class="form-control custom-input" id="address" name="emp_address"
                                required>
                        </div>
                    </div>

                    <!-- Phone -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="phone" class="form-label">
                                Phone
                            </label>

                            <input type="tel" class="form-control custom-input" id="phone" name="emp_phone" required>
                        </div>
                    </div>

                </div>


                <!-- Working -->
                <div class="working-section">

                    <label class="form-label">
                        Working Status
                    </label>

                    <div class="working-box">

                        <input type="checkbox" class="form-check-input" id="Working" name="emp_Working">

                        <label for="Working" class="working-label">
                            Currently Working
                        </label>

                    </div>

                </div>


                <!-- Submit -->
                <div class="d-grid mt-4">

                    <button type="submit" class="btn btn-primary submit-btn">
                        Add Employee
                    </button>

                </div>

            </form>

        </div>

    </div>

    <div class="container">

        <div class="employee-form-card">

            <h3>Employee Form</h3>

            <form method="POST">
                {% csrf_token %}

                {{ form.as_p }}

                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-primary">
                        Submit
                    </button>
                </div>

            </form>

        </div>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
