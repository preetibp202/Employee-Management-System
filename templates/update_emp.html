<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Employee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
   {% include 'navbar.html' %}
    <h1 class="text-center  my-3">Update Employee</h1>
    <div class="container my-5">
          <form method="POST" action="{% url 'update_emp' emp.id %}">
            {% csrf_token %}
            <div class="mb-3">
    <label for="emp_id" class="form-label">Employee ID</label>

    <input type="number"
           class="form-control"
           id="emp_id"
           name="emp_id"
           value="{{ emp.Emp_Id }}"
           required>
</div>
            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" class="form-control" id="name" name="emp_name" value="{{ emp.Name }}" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label"> Email</label>
                <input type="email" class="form-control" id="email" name="emp_email" value="{{ emp.Email }}" required>
            </div>
            <div class="mb-3">
                <label for="department" class="form-label">Department</label>
                <select class="form-select" id="department" name="emp_department" value="{{ emp.Department }}" required>
                    <option value="">Select Department</option>
                    <option value="HR">HR</option>
                    <option value="IT">IT</option>
                    <option value="Finance">Finance</option>
                    <option value="Marketing">Marketing</option>
                    <option value="Software developer">Software developer</option>
                    <option value="Machine Learning">Machine Learning</option>
                    </option>
                </select>
            </div>
              <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <input type="text" class="form-control" id="address" name="emp_address" value="{{ emp.Address }}" required>
            </div>
            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="phone" class="form-control" id="phone" name="emp_phone" value="{{ emp.Phone }}" required>
            </div>
             <div class="mb-3">
                <label for="Working" class="form-label">Working</label>
                <input type="checkbox" class="form-check-input" id="Working" name="emp_Working"  {% if emp.Working %}checked{% endif %}>
            </div>
            
            <button type="submit" class="btn btn-primary">Update Employee</button>
        </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
